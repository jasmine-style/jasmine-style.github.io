<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>JASMINE STYLE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2a1a22;--mute:#8a7580;--acc:#9b2d5a;--gold:#b8924a;--line:#eadfe3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d12;--card:#22141c;--ink:#f6eaf0;--mute:#b79ba9;--acc:#e0709f;--gold:#d9b46a;--line:#38242f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150d12;--card:#22141c;--ink:#f6eaf0;--mute:#b79ba9;--acc:#e0709f;--gold:#d9b46a;--line:#38242f;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh;padding-bottom:70px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:Georgia,serif;letter-spacing:.25em;font-size:18px;color:var(--acc);font-weight:700;cursor:pointer;direction:ltr}
.logo b{color:var(--gold)}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav.cats a{white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--card)}
nav.cats a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;text-align:center;font-size:11px;color:var(--mute);text-decoration:none;position:relative}
.tabbar a.on{color:var(--acc)}.tabbar i{display:block;font-style:normal;font-size:20px}
.badge{position:absolute;top:-2px;inset-inline-start:calc(50% + 6px);background:var(--acc);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px}
main{padding:0 16px 24px;max-width:1100px;margin:auto;perspective:1200px}
.page{animation:pin .5s ease both;transform-origin:50% 0}
@keyframes pin{from{opacity:0;transform:rotateX(-8deg) translateY(18px)}to{opacity:1;transform:none}}
.hero{position:relative;margin:14px 0;border-radius:24px;padding:26px 18px 20px;color:#fff;background:linear-gradient(135deg,#4a0f2c,#9b2d5a 60%,#c98a5a);overflow:hidden;text-align:center}
.hero h1{font-family:Georgia,serif;letter-spacing:.2em;font-size:28px;direction:ltr}
.hero p{opacity:.85;margin:6px 0 0;font-size:14px}
.ring{height:230px;position:relative;transform-style:preserve-3d;perspective:900px;margin:10px 0 4px}
.ring .spin{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 22s linear infinite}
.ring:active .spin{animation-play-state:paused}
@keyframes spin{to{transform:rotateY(-360deg)}}
.ring .it{position:absolute;top:10px;left:50%;width:110px;height:170px;margin-left:-55px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer;backface-visibility:hidden}
.ring .it svg{width:84px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--acc);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;transition:transform .2s}
.btn:active{transform:scale(.96)}.btn.gold{background:linear-gradient(135deg,#d9b46a,#b8924a);color:#2a1a22}.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:7px 14px;font-size:13px}.btn.red{background:#b3261e}
h2{font-size:19px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;will-change:transform}
.card:hover{box-shadow:0 14px 30px rgba(155,45,90,.2)}
.card .im{aspect-ratio:3/4;display:grid;place-items:center;position:relative;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover}.card .im svg{width:62%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));transform:translateZ(30px)}
.card .in{padding:10px 12px}.card .nm{font-size:14px}.pr{color:var(--acc);font-weight:700}.pr s{color:var(--mute);font-weight:400;font-size:12px;margin-inline-start:6px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:#2a1a22;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}
.rv{opacity:0;transform:translateY(24px) rotateX(10deg);transition:.6s}.rv.v{opacity:1;transform:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 2px var(--acc)}
.pd{display:grid;gap:16px}@media(min-width:760px){.pd{grid-template-columns:1fr 1fr}}
.pd .big{aspect-ratio:3/4;border-radius:22px;display:grid;place-items:center;overflow:hidden;transition:transform .1s;transform-style:preserve-3d}.pd .big svg{width:60%;transform:translateZ(40px)}.pd .big img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ci .th{width:60px;height:76px;border-radius:12px;display:grid;place-items:center;overflow:hidden;flex:none}.ci .th img{width:100%;height:100%;object-fit:cover}.ci .th svg{width:70%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);white-space:nowrap;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff}
.st{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line)}.st.ok{background:#1f7a4c;color:#fff}.st.wr{background:#c77d12;color:#fff}.st.bd{background:#b3261e;color:#fff}
.note{font-size:12px;color:var(--mute);line-height:1.7}
.toast{position:fixed;bottom:84px;inset-inline:16px;background:var(--ink);color:var(--bg);padding:12px;border-radius:14px;text-align:center;z-index:50;animation:pin .3s}
.rc{max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start}
</style>
</head>
<body>
<header><div class="logo" onclick="go('')">JASMINE <b>STYLE</b></div><button class="btn sm ghost" onclick="go('admin')" id="admb" hidden>لوحة التحكم</button></header>
<nav class="cats" id="cats"></nav>
<main id="app"></main>
<div class="tabbar" id="tb"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://mutdovrpdarkoiwalgvy.supabase.co',SB_KEY='sb_publishable_ngbZ68OdAZcRtkk0ixNHVQ_iaX-YaQH';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS={women:'ملابس نسائية',abaya:'عبايات',lingerie:'ملابس داخلية',hijab:'حجاب وإكسسوارات'};
const ST=['جديد','مؤكد','تم الشحن','تم التسليم','ملغي'];
const SEED=[
['p1','فستان سهرة ياسمين','women',1450,1850,12,'S,M,L,XL','#9b2d5a,#1c1c28,#2f6b5a'],
['p2','بلوزة حرير ناعمة','women',690,0,20,'S,M,L','#f1d9cf,#c9a0b4'],
['p3','عباية ملكية مطرزة','abaya',1890,2300,8,'52,54,56,58','#111111,#3b2a4a'],
['p4','عباية كاجوال يومية','abaya',950,0,15,'52,54,56','#2c3e50,#111111,#6b4f3a'],
['p5','طقم داخلي دانتيل','lingerie',520,650,25,'S,M,L,XL','#e8b4c8,#111111'],
['p6','قميص نوم ساتان','lingerie',640,0,14,'M,L,XL','#c9a0b4,#7a1f4a'],
['p7','طرحة شيفون فاخرة','hijab',220,0,40,'حر','#d9b8a8,#111111,#9b2d5a'],
['p8','عقد وإكسسوار ذهبي','hijab',310,390,30,'حر','#d9b46a']];
const seed=()=>SEED.map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],old:a[4],stock:a[5],sizes:a[6],colors:a[7],img:''}));
const DEFSET={methods:[{id:'vf',name:'فودافون كاش',info:'01000000000',receipt:true,on:true},{id:'cod',name:'الدفع عند الاستلام',info:'',receipt:false,on:true}],ship:60};
let S={products:seed(),orders:[],set:DEFSET,cart:[],uid:'guest',admin:false,db:null,live:false,sel:{}};
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.cart=LS.g('js_cart',[]);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function art(p,c){c=c||(p.colors||'#9b2d5a').split(',')[0];const k=p.cat;
const sh={women:'M40 10l-10 14 8 10-14 78h72l-14-78 8-10-10-14c-6 8-14 8-20 8s-14 0-20-8z',abaya:'M42 8l-12 24-14 92h88l-14-92-12-24c-6 6-14 8-18 8s-12-2-18-8z',lingerie:'M24 30c10 30 22 30 36 30s26 0 36-30c-6 40-20 46-36 46S30 70 24 30zM48 80l-8 36h40l-8-36z',hijab:'M60 8c-30 0-48 30-44 70 10 24 22 40 44 50 22-10 34-26 44-50 4-40-14-70-44-70z'}[k]||'';
return `<svg viewBox="0 0 120 130"><defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs><path d="${sh}" fill="url(#g${p.id})"/><path d="${sh}" fill="none" stroke="#fff" stroke-opacity=".35"/></svg>`}
const bg=p=>{const c=(p.colors||'#9b2d5a').split(',')[0];return `background:linear-gradient(160deg,${c}33,${c}11 60%,var(--card))`};
const im=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:art(p);
const money=n=>Number(n).toLocaleString('ar-EG')+' ج.م';
function card(p){return `<div class="card rv" onclick="go('p/${p.id}')"><div class="im" style="${bg(p)}">${p.old?'<span class="tag">خصم '+Math.round(100-p.price/p.old*100)+'%</span>':''}${p.stock<=0?'<span class="tag" style="background:#b3261e;color:#fff">نفد</span>':''}${im(p)}</div><div class="in"><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}${p.old?`<s>${money(p.old)}</s>`:''}</div></div></div>`}
/* ---------- storage ---------- */
function persistLocal(){LS.s('js_p',S.products);LS.s('js_o',S.orders);LS.s('js_s',S.set)}
/* ---------- router ---------- */
function soft(){if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))route()}
function go(h){location.hash=h}
function route(){const h=(location.hash.slice(1)||'home').split('/');const r=h[0],a=h[1];let html='';
if(r=='home')html=home();else if(CATS[r])html=catPage(r);else if(r=='p')html=prodPage(a);else if(r=='cart')html=cartPage();else if(r=='checkout')html=checkout();else if(r=='account')html=account();else if(r=='admin')html=S.admin?admin():'<div class="box">هذه الصفحة للإدارة فقط. '+(S.user?'حسابك غير مصرّح له.':'سجّلي دخولك بحساب الإدارة من <a href="#account">حسابي</a>.')+'</div>';else html=home();
$('#app').innerHTML=`<div class="page">${html}</div>`;scrollTo(0,0);
$('#cats').innerHTML=Object.keys(CATS).map(k=>`<a href="#${k}" class="${r==k?'on':''}">${CATS[k]}</a>`).join('');
const n=S.cart.reduce((s,i)=>s+i.q,0);
$('#tb').innerHTML=[['home','🏠','الرئيسية'],['women','🛍️','التسوق'],['cart','👜','السلة'],['account','👤','حسابي']].map(t=>`<a href="#${t[0]}" class="${r==t[0]||(t[0]=='women'&&CATS[r])?'on':''}"><i>${t[1]}</i>${t[2]}${t[0]=='cart'&&n?`<span class="badge">${n}</span>`:''}</a>`).join('');
$('#admb').hidden=!S.admin;{const rv=S.orders.filter(o=>o.payStatus=='review').length;$('#admb').textContent='لوحة التحكم'+(rv?' ('+rv+')':'')}
document.querySelectorAll('.rv').forEach(e=>io.observe(e));bindTilt()}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');io.unobserve(e.target)}}),{threshold:.1});
function bindTilt(){document.querySelectorAll('.card,.pd .big').forEach(el=>{el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`});el.addEventListener('pointerleave',()=>el.style.transform='')})}
/* ---------- pages ---------- */
function home(){const ps=S.products,sale=ps.filter(p=>p.old),nw=ps.slice(-4);
const ring=ps.slice(0,6).map((p,i)=>`<div class="it" style="transform:rotateY(${i*60}deg) translateZ(150px)" onclick="go('p/${p.id}')">${im(p)}</div>`).join('');
return `<div class="hero"><h1>JASMINE STYLE</h1><p>أناقة تليق بكِ · توصيل لكل المحافظات</p><div class="ring"><div class="spin">${ring}</div></div><button class="btn gold" onclick="go('women')">تسوقي الآن</button></div>
<div class="grid" style="grid-template-columns:repeat(2,1fr)">${Object.keys(CATS).map(k=>`<div class="box rv" style="text-align:center;cursor:pointer;margin:0" onclick="go('${k}')"><b>${CATS[k]}</b></div>`).join('')}</div>
${sale.length?`<h2>🔥 العروض</h2><div class="grid">${sale.map(card).join('')}</div>`:''}<h2>✨ وصل حديثًا</h2><div class="grid">${nw.map(card).join('')}</div>`}
function catPage(k){const ps=S.products.filter(p=>p.cat==k);return `<h2>${CATS[k]}</h2><div class="grid">${ps.map(card).join('')||'<p class="note">لا توجد منتجات بعد.</p>'}</div>`}
function prodPage(id){const p=S.products.find(x=>x.id==id);if(!p)return '<p>المنتج غير موجود</p>';const sz=p.sizes.split(','),cl=p.colors.split(',');const s=S.sel;if(s.id!=id)S.sel=Object.assign({id,size:sz[0],color:cl[0]});
return `<div class="pd" style="margin-top:14px"><div class="big" style="${bg(p)}">${im(p)}</div><div><h2 style="margin-top:0">${esc(p.name)}</h2><div class="pr" style="font-size:20px">${money(p.price)}${p.old?`<s>${money(p.old)}</s>`:''}</div><p class="note">${p.stock>0?'متوفر: '+p.stock+' قطعة':'غير متوفر حاليًا'}</p>
<label>المقاس</label><div class="chips">${sz.map(z=>`<span class="chip ${S.sel.size==z?'on':''}" onclick="S.sel.size='${z}';route()">${esc(z)}</span>`).join('')}</div>
<label>اللون</label><div class="chips">${cl.map(c=>`<span class="sw ${S.sel.color==c?'on':''}" style="background:${esc(c)}" onclick="S.sel.color='${c}';route()"></span>`).join('')}</div>
<br><button class="btn" ${p.stock<=0?'disabled':''} onclick="addCart('${p.id}')">أضيفي إلى السلة</button></div></div>`}
function addCart(id){const s=S.sel,e=S.cart.find(i=>i.id==id&&i.size==s.size&&i.color==s.color);e?e.q++:S.cart.push({id,size:s.size,color:s.color,q:1});LS.s('js_cart',S.cart);toast('تمت الإضافة للسلة ✓');route()}
const total=()=>S.cart.reduce((t,i)=>{const p=S.products.find(x=>x.id==i.id);return t+(p?p.price*i.q:0)},0);
function cartPage(){if(!S.cart.length)return '<h2>السلة فارغة 👜</h2><button class="btn" onclick="go(\'home\')">ابدئي التسوق</button>';
return `<h2>سلة التسوق</h2>${S.cart.map((i,x)=>{const p=S.products.find(q=>q.id==i.id);if(!p)return '';return `<div class="ci"><div class="th" style="${bg(p)}">${im(p)}</div><div style="flex:1"><div>${esc(p.name)}</div><div class="note">${esc(i.size)} · <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${esc(i.color)}"></span></div><div class="pr">${money(p.price*i.q)}</div></div><div class="chips"><button class="chip" onclick="qty(${x},1)">+</button><b>${i.q}</b><button class="chip" onclick="qty(${x},-1)">−</button></div></div>`}).join('')}
<div class="box"><div class="row"><span>المجموع</span><b>${money(total())}</b></div><div class="row note"><span>الشحن</span><span>${money(S.set.ship)}</span></div><br><button class="btn gold" style="width:100%" onclick="go('checkout')">إتمام الطلب</button></div>`}
function qty(x,d){S.cart[x].q+=d;if(S.cart[x].q<1)S.cart.splice(x,1);LS.s('js_cart',S.cart);route()}
function checkout(){if(!S.cart.length)return cartPage();const ms=S.set.methods.filter(m=>m.on);S.pay=S.pay||ms[0]?.id;
return `<h2>إتمام الطلب</h2><div class="box"><label>الاسم</label><input id="cn"><label>رقم الموبايل</label><input id="cp" type="tel" inputmode="tel"><label>العنوان بالتفصيل</label><textarea id="ca" rows="2"></textarea></div>
<div class="box"><b>طريقة الدفع</b><div class="chips" style="margin-top:8px">${ms.map(m=>`<span class="chip ${S.pay==m.id?'on':''}" onclick="S.pay='${m.id}';keep();route()">${esc(m.name)}</span>`).join('')}</div>${payBox(ms.find(m=>m.id==S.pay))}</div>
<div class="box"><div class="row"><b>الإجمالي مع الشحن</b><b class="pr">${money(total()+S.set.ship)}</b></div></div><button class="btn gold" style="width:100%" onclick="placeOrder()">تأكيد الطلب</button>`}
function keep(){S.f={n:$('#cn')?.value,p:$('#cp')?.value,a:$('#ca')?.value}}
function payBox(m){if(!m)return '';if(!m.receipt)return `<p class="note">${m.info?esc(m.info):'ادفعي عند استلام الطلب.'}</p>`;
return `<p class="note">حوّلي ${money(total()+S.set.ship)} إلى الرقم:</p><div class="pr" style="font-size:22px;direction:ltr;text-align:center">${esc(m.info)}</div><label>رقم العملية</label><input id="tx" inputmode="numeric"><label>صورة إيصال الدفع</label><input id="rc" type="file" accept="image/*"><p class="note">لن يُعتبر الطلب مدفوعًا إلا بعد مراجعة الإدارة والتأكد من وصول المبلغ.</p>`}
const toData=(f,mx,q)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=u});
async function placeOrder(){if(!S.user){toast('سجّلي دخولك أولًا');return go('account')}const n=$('#cn').value.trim(),ph=$('#cp').value.trim(),ad=$('#ca').value.trim();const m=S.set.methods.find(x=>x.id==S.pay);
if(!n||ph.length<10||!ad)return toast('أكملي الاسم والموبايل والعنوان');let tx='',rc='';
if(m.receipt){tx=$('#tx').value.trim();const f=$('#rc').files[0];if(!tx||!f)return toast('أدخلي رقم العملية وأرفقي الإيصال');rc=await toData(f,640,.5)}
const o={id:'O'+Date.now().toString(36).toUpperCase(),uid:S.uid,name:n,phone:ph,addr:ad,items:S.cart.map(i=>{const p=S.products.find(x=>x.id==i.id);return {id:i.id,name:p.name,size:i.size,color:i.color,q:i.q,price:p.price}}),total:total()+S.set.ship,pay:m.id,payName:m.name,txn:tx,receipt:rc,payStatus:m.receipt?'review':'cod',status:0,date:new Date().toLocaleString('ar-EG')};
try{const{error}=await sb.rpc('place_order',{o});if(error)throw error;await load();S.cart=[];LS.s('js_cart',[]);S.pay=null;toast('تم استلام طلبك رقم '+o.id);go('account')}catch(e){toast('تعذر إرسال الطلب، حاولي مرة أخرى')}}
const pst=o=>({review:['قيد مراجعة الدفع','wr'],paid:['تم تأكيد الدفع','ok'],rejected:['الدفع مرفوض','bd'],cod:['الدفع عند الاستلام','']}[o.payStatus]);
function orderCard(o,adm){const ps=pst(o);return `<div class="box"><div class="row"><b>${o.id}</b><span class="st">${ST[o.status]}</span></div><div class="note">${o.date}</div>${o.items.map(i=>`<div class="note">${esc(i.name)} × ${i.q} (${esc(i.size)})</div>`).join('')}<div class="row"><b class="pr">${money(o.total)}</b><span class="st ${ps[1]}">${ps[0]}</span></div>
${adm?`<div class="note">👤 ${esc(o.name)} · ${esc(o.phone)}<br>📍 ${esc(o.addr)}<br>${esc(o.payName)} ${o.txn?'· رقم العملية: '+esc(o.txn):''}</div>${o.receipt?`<img class="rc" src="${o.receipt}" alt="إيصال">`:''}
<div class="chips" style="margin-top:8px">${o.payStatus=='review'?`<button class="btn sm" onclick="payAct('${o.id}','paid')">تأكيد وصول المبلغ</button><button class="btn sm red" onclick="payAct('${o.id}','rejected')">رفض</button>`:''}<select onchange="ordSt('${o.id}',this.value)" style="width:auto">${ST.map((s,i)=>`<option value="${i}" ${o.status==i?'selected':''}>${s}</option>`).join('')}</select></div>`:''}</div>`}
async function payAct(id,v){const o=S.orders.find(x=>x.id==id);o.payStatus=v;if(v=='paid'&&o.status==0)o.status=1;await updOrder(o);route()}
async function ordSt(id,v){const o=S.orders.find(x=>x.id==id);o.status=+v;await updOrder(o);route()}
function account0(){const mine=S.orders.filter(o=>o.uid==S.uid).reverse();
return `<h2>حسابي</h2><div class="box note">${S.live?'مسجّلة بـ '+esc(S.user?.email):'وضع المعاينة: البيانات محفوظة على هذا الجهاز فقط.'}</div><h2>طلباتي</h2>${mine.map(o=>orderCard(o,false)).join('')||'<p class="note">لا توجد طلبات بعد.</p>'}<button class="btn ghost sm" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">🌓 تغيير المظهر</button>`}
/* ---------- admin ---------- */
function admin(){const t=S.at||'orders';let b='';
if(t=='orders'){const l=[...S.orders].reverse();b=`<div class="box note">طلبات تحتاج مراجعة دفع: <b>${S.orders.filter(o=>o.payStatus=='review').length}</b> · إجمالي المبيعات المؤكدة: <b>${money(S.orders.filter(o=>o.payStatus=='paid'||(o.payStatus=='cod'&&o.status==3)).reduce((s,o)=>s+o.total,0))}</b></div>`+(l.map(o=>orderCard(o,true)).join('')||'<p class="note">لا توجد طلبات.</p>')}
if(t=='products')b=`<button class="btn sm" onclick="editP()">+ منتج جديد</button> ${S.live&&!S.dbp?'<button class="btn sm ghost" onclick="seedDb()">نشر المنتجات التجريبية</button>':''}<table><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th></th></tr>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.stock}</td><td><button class="btn sm ghost" onclick="editP('${p.id}')">تعديل</button> <button class="btn sm red" onclick="if(confirm('حذف المنتج؟'))delProduct('${p.id}').then(route)">حذف</button></td></tr>`).join('')}</table><div id="pf"></div>`;
if(t=='pay')b=`<div class="box"><label>تكلفة الشحن (ج.م)</label><input id="sh" type="number" value="${S.set.ship}">${S.set.methods.map((m,i)=>`<div class="box"><div class="row"><b>${esc(m.name)}</b><label style="margin:0"><input type="checkbox" style="width:auto" ${m.on?'checked':''} onchange="S.set.methods[${i}].on=this.checked"> مفعّلة</label></div><label>${m.receipt?'رقم المحفظة / الحساب':'ملاحظة للعميلة'}</label><input value="${esc(m.info)}" oninput="S.set.methods[${i}].info=this.value"></div>`).join('')}
<b>إضافة طريقة دفع جديدة</b><label>الاسم (مثال: إنستا باي)</label><input id="mn"><label>رقم الحساب / الرابط</label><input id="mi"><label style="display:flex;gap:8px"><input type="checkbox" id="mr" style="width:auto" checked> تتطلب إيصال</label><button class="btn sm ghost" onclick="addM()">إضافة</button><br><br><button class="btn gold" onclick="saveSettings()">حفظ الإعدادات</button></div>`;
if(t=='cust'){const m={};S.orders.forEach(o=>{(m[o.phone]=m[o.phone]||{n:o.name,p:o.phone,c:0,t:0}).c++;m[o.phone].t+=o.total});b=`<table><tr><th>العميلة</th><th>الموبايل</th><th>طلبات</th><th>الإجمالي</th></tr>${Object.values(m).map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.p)}</td><td>${c.c}</td><td>${c.t}</td></tr>`).join('')}</table>`}
return `<h2>لوحة التحكم</h2>${S.live?'':'<div class="box note">وضع المعاينة المحلي: أي زائر يرى هذه اللوحة. انشري الصفحة وسجّلي بحسابك لتصبح لك وحدك.</div>'}<div class="tabs">${[['orders','الطلبات'],['products','المنتجات والمخزون'],['pay','الدفع والأسعار'],['cust','العملاء']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="S.at='${x[0]}';route()">${x[1]}</button>`).join('')}</div>${b}`}
function addM(){const n=$('#mn').value.trim();if(!n)return;S.set.methods.push({id:'m'+Date.now(),name:n,info:$('#mi').value,receipt:$('#mr').checked,on:true});saveSettings()}
async function saveSettings(){const s=$('#sh');if(s)S.set.ship=+s.value||0;await saveSet();toast('تم الحفظ ✓');route()}
async function seedDb(){for(const p of seed())await saveProduct(p);toast('تم النشر')}
function editP(id){const p=S.products.find(x=>x.id==id)||{id:'p'+Date.now(),name:'',cat:'women',price:0,old:0,stock:0,sizes:'S,M,L',colors:'#9b2d5a',img:''};S.ed=p;
$('#pf').innerHTML=`<div class="box"><label>الاسم</label><input id="fn" value="${esc(p.name)}"><label>القسم</label><select id="fc">${Object.keys(CATS).map(k=>`<option value="${k}" ${p.cat==k?'selected':''}>${CATS[k]}</option>`).join('')}</select><label>السعر</label><input id="fp" type="number" value="${p.price}"><label>السعر قبل الخصم (اختياري)</label><input id="fo" type="number" value="${p.old||0}"><label>المخزون</label><input id="fs" type="number" value="${p.stock}"><label>المقاسات (بفاصلة)</label><input id="fz" value="${esc(p.sizes)}"><label>الألوان (أكواد hex بفاصلة)</label><input id="fl" value="${esc(p.colors)}"><label>صورة المنتج</label><input id="fi" type="file" accept="image/*"><br><br><button class="btn gold" onclick="saveP()">حفظ المنتج</button></div>`;$('#pf').scrollIntoView({behavior:'smooth'})}
async function saveP(){const p=S.ed;p.name=$('#fn').value.trim();p.cat=$('#fc').value;p.price=+$('#fp').value;p.old=+$('#fo').value;p.stock=+$('#fs').value;p.sizes=$('#fz').value||'حر';p.colors=$('#fl').value||'#9b2d5a';const f=$('#fi').files[0];if(f)p.img=await toData(f,520,.6);
if(!p.name||!p.price)return toast('الاسم والسعر مطلوبان');try{await saveProduct(p);toast('تم الحفظ ✓');route()}catch(e){toast('لا تملكين صلاحية الحفظ')}}
/* ---------- supabase ---------- */
async function saveProduct(p){const{error}=await sb.from('products').upsert({id:p.id,data:p});if(error)throw error;await load()}
async function delProduct(id){const{data,error}=await sb.from('products').delete().eq('id',id).select('id');if(error||!data||!data.length){toast('تعذر الحذف: تأكدي أنك مسجّلة كأدمن وأن المنتج منشور');return}S.products=S.products.filter(x=>x.id!=id);toast('تم الحذف ✓');await load()}
async function saveSet(){await sb.from('settings').upsert({id:'main',data:S.set})}
async function updOrder(o){const{uid,...d}=o;await sb.from('orders').update({data:d}).eq('id',o.id)}
async function load(){const[a,b,c]=await Promise.all([sb.from('products').select('data'),sb.from('settings').select('data').eq('id','main'),sb.from('orders').select('uid,data').order('created')]);
if(a.data){S.products=a.data.map(r=>r.data);S.dbp=a.data.length>0}if(b.data&&b.data[0])S.set=b.data[0].data;S.orders=(c.data||[]).map(r=>({...r.data,uid:r.uid}));soft()}
async function setUser(u){S.user=u||null;S.uid=u?u.id:'guest';S.admin=false;if(u){const{data}=await sb.from('admins').select('uid').eq('uid',u.id);S.admin=!!(data&&data.length)}}
async function auth(m){const e=$('#ae').value.trim(),p=$('#ap').value;const r=m=='up'?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);toast('تم ✓')}
function account(){return S.user?account0()+'<br><button class="btn ghost sm" onclick="sb.auth.signOut()">تسجيل خروج</button>':`<h2>حسابي</h2><div class="box"><label>الإيميل</label><input id="ae" type="email" dir="ltr"><label>كلمة السر (٦ أحرف على الأقل)</label><input id="ap" type="password" dir="ltr"><br><br><button class="btn" onclick="auth('in')">دخول</button> <button class="btn ghost" onclick="auth('up')">حساب جديد</button></div>`}
S.live=true;S.cart=LS.g('js_cart',[]);addEventListener('hashchange',route);route();
(async()=>{try{const{data:{session}}=await sb.auth.getSession();await setUser(session&&session.user);sb.auth.onAuthStateChange(async(_e,x)=>{await setUser(x&&x.user);await load()});await load()}catch(e){console.error(e)}})();
</script>
</body>
</html>
